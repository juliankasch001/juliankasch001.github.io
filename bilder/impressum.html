<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Impressum – Julian Kasch</title>
  <style>
    :root{--bg:#0b0e12;--bg2:#0f141b;--silver1:#F2F5F8;--silver2:#C9D2DD;--muted:rgba(201,210,221,.78);--text:rgba(242,245,248,.92);--shadow:0 18px 60px rgba(0,0,0,.55);--radius:22px;--max:900px;--line:rgba(140,152,166,.22);}
    *{box-sizing:border-box}
    body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;color:var(--text);background:radial-gradient(1200px 700px at 25% 10%, rgba(242,245,248,.06), transparent 60%),linear-gradient(180deg,var(--bg) 0%,var(--bg2) 60%, #090b0f 100%);}
    .wrap{max-width:var(--max);margin:0 auto;padding:26px 18px 80px}
    .panel{border:1px solid rgba(140,152,166,.20);background:rgba(255,255,255,.03);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
    h1{margin:0 0 10px;text-transform:uppercase;letter-spacing:1.2px;font-size:26px;color:var(--silver1)}
    p{color:var(--muted);line-height:1.75;font-size:14px}
    a{color:var(--silver1);text-decoration:none}
    .top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
    .back{border:1px solid rgba(140,152,166,.22);padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.02);color:var(--silver2);font-weight:800;text-transform:uppercase;letter-spacing:1px;font-size:12px}
    .hr{height:1px;background:var(--line);margin:18px 0}
  </style>
<style id="julian-brand-override">
:root{--brand-navy:#071a38;--brand-blue:#1265e8;--brand-blue-soft:#eaf2ff;--brand-warm:#fbf8f2;--brand-text:#13233d;--brand-muted:#61708a;--brand-line:#dbe4f0;--brand-shadow:0 20px 60px rgba(7,26,56,.10)}
html{scroll-behavior:smooth}
body{color:var(--brand-text)!important;background:radial-gradient(700px 420px at 90% 5%,rgba(18,101,232,.10),transparent 65%),linear-gradient(180deg,#fff 0%,var(--brand-warm) 100%)!important;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important;letter-spacing:0!important}
.topbar{background:rgba(255,255,255,.92)!important;border-bottom:1px solid var(--brand-line)!important;box-shadow:0 8px 30px rgba(7,26,56,.05)!important}
.brand,.brand *{color:var(--brand-navy)!important}.brand .dot{background:var(--brand-blue)!important;box-shadow:0 0 0 7px var(--brand-blue-soft)!important}
.links,.links a{color:var(--brand-text)!important}.links a:hover{background:var(--brand-blue-soft)!important;color:var(--brand-blue)!important}
.cta,.btn,.back{color:var(--brand-navy)!important;background:#fff!important;border:1px solid #9eb9de!important;box-shadow:none!important;border-radius:12px!important}
.cta:hover,.btn:hover,.back:hover{border-color:var(--brand-blue)!important;color:var(--brand-blue)!important;transform:translateY(-1px)}
.btnPrimary{background:var(--brand-blue)!important;color:#fff!important;border-color:var(--brand-blue)!important;box-shadow:0 12px 28px rgba(18,101,232,.22)!important}
.wrap{max-width:1100px!important}.page{padding-top:38px!important}
.panel{background:rgba(255,255,255,.96)!important;border:1px solid var(--brand-line)!important;border-radius:28px!important;box-shadow:var(--brand-shadow)!important}
.head{background:linear-gradient(135deg,#fff,var(--brand-blue-soft))!important;border-bottom:1px solid var(--brand-line)!important}
h1{color:var(--brand-navy)!important;background:none!important;-webkit-text-fill-color:initial!important;font-weight:850!important;letter-spacing:-.02em!important}
h2,h3,.sectionTitle{color:var(--brand-navy)!important}p,li,.sub,.mini,.note,.foot,label{color:var(--brand-muted)!important}strong{color:var(--brand-navy)}a{color:var(--brand-blue)}
.content{gap:24px!important}.card,.box{background:#fff!important;border:1px solid var(--brand-line)!important;box-shadow:0 10px 30px rgba(7,26,56,.06)!important;border-radius:20px!important}
.toc a{background:#fff!important;border:1px solid var(--brand-line)!important;color:var(--brand-text)!important}.toc a:hover{background:var(--brand-blue-soft)!important;border-color:var(--brand-blue)!important;color:var(--brand-blue)!important;box-shadow:none!important}
.line,.hr{background:linear-gradient(90deg,transparent,var(--brand-blue),transparent)!important}
input,textarea,select{color:var(--brand-text)!important;background:#fff!important;border:1px solid #cbd8e8!important;border-radius:12px!important}
input:focus,textarea:focus,select:focus{border-color:var(--brand-blue)!important;box-shadow:0 0 0 4px var(--brand-blue-soft)!important}
footer{border-top:1px solid var(--brand-line)!important;color:var(--brand-muted)!important}
@media(max-width:720px){.panel{border-radius:18px!important}.head,.content{padding-left:18px!important;padding-right:18px!important}}
@media print{body{background:#fff!important}.panel,.card{box-shadow:none!important}}
</style>
</head>
<body>

      <a class="back" href="/">← Zurück</a>

      <p>
        Verantwortlich für den Inhalt nach § 18 Abs. 2 MStV:<br>

      </p>
    </div>
  </div>
</body>
</html>
